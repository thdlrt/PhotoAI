name: Core checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight test dependencies
        run: python -m pip install -e . pytest
      - name: Syntax checks
        run: |
          python -m compileall -q src
          node --check src/landscape_culler/static/app.js
      - name: File safety and packaging contracts
        run: python -m pytest tests/test_xmp_cleanup.py tests/test_toolbox.py tests/test_packaging_contract.py -q
