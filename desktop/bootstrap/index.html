<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>摄影后期工具箱</title>
    <link rel="stylesheet" href="bootstrap.css" />
    <script defer src="bootstrap.js"></script>
  </head>
  <body>
    <main class="startup" aria-live="polite">
      <h1>摄影后期工具箱</h1>
      <p id="status">正在启动…</p>
      <p id="detail" class="detail" hidden></p>
      <div id="actions" class="actions" hidden>
        <button id="retry" type="button">重试</button>
        <button id="logs" type="button" class="secondary">打开日志</button>
        <button id="reconnect" type="button" class="secondary">重新连接数据目录</button>
      </div>
    </main>
  </body>
</html>
