[package]
name = "photoai-desktop"
version = "0.9.0-beta.2"
description = "照片选片 Windows 桌面应用"
authors = ["PhotoAI"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "PhotoAI"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rfd = "=0.15.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-deep-link = "=2.4.10"
tauri-plugin-single-instance = { version = "=2.4.4", features = ["deep-link"] }
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
url = "=2.5.8"
uuid = { version = "=1.26.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }
winreg = "=0.55.0"
